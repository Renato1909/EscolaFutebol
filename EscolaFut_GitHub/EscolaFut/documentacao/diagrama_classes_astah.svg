<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="1430" viewBox="0 0 1680 1430" role="img" aria-labelledby="title desc">
  <title id="title">Diagrama de classes UML — EscolaFut_SQLServer</title>
  <desc id="desc">Diagrama UML monocromático no estilo de uma ferramenta CASE, com classes, atributos, operações e relacionamentos.</desc>
  <defs>
    <marker id="association" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#222"/></marker>
    <marker id="generalization" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1 1 L10 6 L1 11 Z" fill="#fff" stroke="#222" stroke-width="1.2"/></marker>
    <marker id="dependency" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#222" stroke-width="1.2"/></marker>
    <style>
      text{font-family:Arial,Helvetica,sans-serif;fill:#111}
      .diagram-title{font-size:24px;font-weight:bold}.hint{font-size:13px;fill:#333}
      .frame{fill:none;stroke:#777;stroke-width:1}.frame-title{font-size:15px;font-weight:bold;fill:#333}
      .class{fill:#fff;stroke:#222;stroke-width:1.4}.class-head{fill:#f2f2f2;stroke:#222;stroke-width:1.4}
      .name{font-size:16px;font-weight:bold}.stereo{font-size:12px;font-style:italic}.member{font-size:13px}
      .rel{fill:none;stroke:#222;stroke-width:1.4}.dep{fill:none;stroke:#222;stroke-width:1.3;stroke-dasharray:7 5}
      .label{font-size:12px}.mult{font-size:12px;font-weight:bold}
    </style>
  </defs>
  <rect width="1680" height="1430" fill="#fff"/>
  <text x="40" y="42" class="diagram-title">EscolaFut_SQLServer — Class Diagram</text>
  <text x="40" y="66" class="hint">UML class diagram · domain, DAO, connection, and Swing interface</text>

